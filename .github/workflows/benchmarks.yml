name: Benchmarks

# Full benchmark run on demand (Actions > Benchmarks > Run workflow).
# Shared runners are noisy: compare the Ratio / Alloc Ratio columns, not absolute nanoseconds.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (e.g. *, *Send*, *Startup*)'
        default: '*'
        required: true
      runtimes:
        description: 'Runtimes to compare (space separated)'
        default: 'net10.0'
        required: true

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run benchmarks
        run: >
          dotnet run -c Release -f net10.0 --project benchmarks/PulseFlow.Benchmarks --
          --filter "${{ inputs.filter }}"
          --runtimes ${{ inputs.runtimes }}
          --artifacts BenchmarkResults

      - name: Publish summary
        if: always()
        run: |
          for report in BenchmarkResults/results/*-report-github.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY" && echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkResults
