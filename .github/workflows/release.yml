name: Release

# Push a tag like v2.0.0 or v2.0.0-rc.1 to test, pack and publish PulseFlow and PulseFlow.FluentValidation to NuGet.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build PulseFlow.sln -c Release -p:Version=${PACKAGE_VERSION}

      - name: Test
        run: dotnet test PulseFlow.sln -c Release --no-build

      - name: Pack
        run: dotnet pack PulseFlow.sln -c Release --no-build -o artifacts -p:Version=${PACKAGE_VERSION}

      # Pushes every .nupkg; the matching .snupkg symbol packages are pushed automatically.
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
